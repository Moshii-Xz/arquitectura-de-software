spring:
  application:
    name: agro-inteligente
  profiles:
    active: dev
  jackson:
    time-zone: America/Bogota
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt-secret: YWdyby1pbnRlbGlnZW50ZS1kZXZlbG9wbWVudC1zZWNyZXQtMzItYnl0ZXMhIQ==
    jwt-issuer: agro-inteligente
    jwt-expiration-minutes: 120
  climate:
    base-url: https://api.open-meteo.com/v1/forecast

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.agrointeligente: DEBUG
