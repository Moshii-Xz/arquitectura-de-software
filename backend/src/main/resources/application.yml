spring:
  application:
    name: agrointeligente-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    show-logo: true
    deepLinking: true
    defaultModelsExpandDepth: 1
    defaultModelExpandDepth: 1

logging:
  level:
    root: INFO
    com.agrointeligente: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:9a8f7c6e5d4f3a2b1c0e9d8f7c6e5d4f3a2b1c0e9d8f7c6e5d4f3a2b1c0e9d8f7c6e5d4f3a2b1c0e9d8f7c6e5d}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  max-login-attempts: 5
  lock-timeout-minutes: 15
